plugins {
	id 'java-library'
	id 'maven-publish'
	id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-neoforge-mc${project.minecraft_version_label}"
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// ModDevGradle adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
	version = project.neo_version

	runs {
		client {
			client()
			gameDirectory = project.file('run1')
			programArguments.addAll '--username', 'User1'
		}

		client2 {
			client()
			gameDirectory = project.file('run2')
			programArguments.addAll '--username', 'User2'
		}

		server {
			server()
			programArgument '--nogui'
		}
	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
	}
}

import org.gradle.internal.os.OperatingSystem

tasks.register("launch2clients") {
	group = "neoforge"
	description = "Launches both Minecraft clients for testing"

	doLast {
		def gradleCommand = OperatingSystem.current().isWindows() ? "gradlew.bat" : "./gradlew"

		println "Launching both Minecraft clients..."

		def client1 = new ProcessBuilder(gradleCommand, "runClient").inheritIO().start()
		def client2 = new ProcessBuilder(gradleCommand, "runClient2").inheritIO().start()

		client1.waitFor()
		client2.waitFor()
	}
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	var replaceProperties = [
			minecraft_version_range: minecraft_version_range,
			neo_version            : neo_version,
			mod_id                 : mod_id,
			mod_name               : mod_name,
			mod_license            : mod_license,
			mod_version            : mod_version,
	]
	inputs.properties replaceProperties
	expand replaceProperties
	from "src/main/templates"
	into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 25
}

java {
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
